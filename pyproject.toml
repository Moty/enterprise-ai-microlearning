[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-microlearning"
version = "0.1.0"
description = "Autonomous AI-SME pipeline for SAP and B2B enterprise microlearning"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mordechai (Moty) Moshin", email = "moty.moshin@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0"
]

[project.scripts]
microlearning = "main:app"
